# nginx config for serving a static website as vhost myapp.local
# place at /etc/nginx/conf.d/myapp.conf (or sites-available + symlink)

server {
    listen 80;
    server_name myapp.local;

    root /var/www/myapp;
    index index.html;

    # custom error pages
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /errors/ {
        internal;   # can't be requested directly by users
    }

    # basic caching for static assets
    location ~* \.(css|js|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
