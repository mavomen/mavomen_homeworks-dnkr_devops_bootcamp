# /etc/vsftpd.conf - sample configuration
# man 5 vsftpd.conf for all options

# standalone mode (not run from inetd)
listen=YES

# --- anonymous access ---
# anonymous can download from /srv/ftp (read-only)
anonymous_enable=YES
anon_root=/srv/ftp
# uploads by anonymous stay disabled (security)
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# --- local (dedicated) users ---
# allow the ftpuser account to log in and transfer files
local_enable=YES
write_enable=YES
local_umask=022

# jail every local user inside their home dir
chroot_local_user=YES
# needed because the chroot dir itself is writable in this test setup
allow_writeable_chroot=YES

# --- logging ---
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# --- misc ---
# hide ids, show "ftp" instead of uid/gid in listings
hide_ids=NO
pam_service_name=vsftpd
